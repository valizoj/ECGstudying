<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>心電図 穴埋め試作</title>
<style>
:root{color-scheme:light;--ink:#112b36;--teal:#006459;--line:#cbdcde;--soft:#eef5f4;font:16px/1.65 system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);overflow-wrap:anywhere}
header{background:var(--ink);color:white;padding:.7rem 1rem;padding-top:max(.7rem,env(safe-area-inset-top))}
h1,h2,p{margin:0}
h1{font-size:1.16rem}h2{font-size:1.22rem;line-height:1.4}
main,header>div{width:min(100%,44rem);margin:auto}
main{padding:.65rem .7rem 1.1rem}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem;margin-bottom:.65rem}
button,summary{cursor:pointer;touch-action:manipulation}
button{font:inherit;font-weight:650;color:var(--ink);min-height:44px;background:#fff;border:1px solid var(--line);border-radius:.5rem;padding:.3rem .48rem}
button:focus-visible,summary:focus-visible{outline:3px solid #008476;outline-offset:2px}
nav button[aria-current]{background:var(--teal);color:white;border-color:var(--teal)}
article{background:white;border:1px solid var(--line);border-radius:.75rem;padding:.8rem}
.meta,.tools{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin:.2rem 0 .6rem;color:#435e66;font-size:.875rem}
.example{border-left:3px solid #9ebbb7;padding-left:.65rem;margin:.75rem 0;font-size:1.04rem;line-height:1.95}
.hole{min-width:44px;color:#fff;background:#263d4b;border:1px solid #263d4b}
.example .hole{display:inline-flex;align-items:center;justify-content:center;vertical-align:baseline;min-width:5rem;padding-inline:.65rem;margin:.16rem .15rem;line-height:1.25}
.hole[data-result=good]{background:#14583e;border-color:#14583e}.hole[data-result=again]{background:#8d341a;border-color:#8d341a}
.hole[aria-expanded=true]{color:#003d36;background:#d6f2eb;border-color:#005c4e}
.figure{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:.45rem}
.stage{position:relative;margin-inline:auto;width:100%}
.stage img{width:100%;height:auto;display:block}
.figure.zoom .stage{width:max(100%,min(var(--native),1100px));margin:0}
.mask{position:absolute;display:grid;place-content:center;padding:0;min-width:0;min-height:0;border:0;border-radius:2px;font-size:clamp(.625rem,3vw,.85rem);line-height:1}
.mask.is-open{opacity:0}
figure{margin:.5rem 0}
img{max-width:100%;height:auto}
.hole-list{display:flex;flex-wrap:wrap;gap:.35rem;margin:.65rem 0}
.hole-list button{min-width:44px}
.grader{margin:.6rem 0;padding:.65rem .7rem;background:#e4f3ef;border-radius:.55rem;min-height:4.25rem}
.grader p{font-size:.875rem}
.answer{display:block;font-size:1.09rem;margin:.15rem 0 .45rem}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.rates button:last-child{background:var(--teal);color:white;border-color:var(--teal)}
details{border-top:1px solid var(--line);margin-top:.8rem;font-size:.91rem}
summary{padding:.6rem 0}
details img{display:block;border:1px solid var(--line);margin-top:.55rem}
footer{margin:.6rem .2rem;font-size:.85rem;color:#435e66}
</style>
</head>
<body>

<script>
"use strict";
const labels = ["文章", "図解", "波形", "表"];
const cards = JSON.parse(document.querySelector("#data").textContent);
const nav = document.querySelector("nav");
const article = document.querySelector("article");
const recordKey = "ecg-cloze-preview.v1";
let cardIndex = 0;
let active = -1;
let records = {};
let grader, count, zoom, lastTrigger, openingDetails, storageAvailable = true;
const triggers = [];
try { records = JSON.parse(localStorage.getItem(recordKey) || "{}"); }
catch { storageAvailable = false; }

function element(tag, cls, label) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (label !== undefined) el.textContent = label;
  return el;
}

function btn(label, handler, cls = "") {
  const el = element("button", cls, label);
  el.type = "button";
  el.addEventListener("click", handler);
  return el;
}

function holeButton(index, mode) {
  const trigger = btn("", () => {
    active = active === index ? -1 : index;
    lastTrigger = trigger;
    refresh();
    if (active !== -1) {
      const rect = grader.getBoundingClientRect();
      if (rect.bottom > innerHeight || rect.top < 0) grader.scrollIntoView({ block: "nearest" });
    }
  }, mode === "mask" ? "hole mask" : "hole");
  trigger.setAttribute("aria-controls", "grade");
  triggers.push({ trigger, index, mode });
  return trigger;
}

function render() {
  const card = cards[cardIndex];
  active = -1;
  triggers.length = 0;
  for (const [i, button] of Array.from(nav.children).entries()) {
    if (i === cardIndex) button.setAttribute("aria-current", "page");
    else button.removeAttribute("aria-current");
  }
  article.replaceChildren(element("h2", "", card.title));
  const meta = element("div", "meta");
  count = element("span", "", "");
  meta.append(element("span", "", "画像 " + card.source), count);
  article.append(meta);
  zoom = undefined;
  if (card.text) {
    for (const row of card.text) {
      const p = element("p", "example");
      p.append(...row.map((part) => typeof part === "number" ? holeButton(part, "text") : part));
      article.append(p);
    }
  } else {
    const tools = element("div", "tools");
    tools.append(element("span", "", "黒い箇所をタップ"));
    const viewport = element("figure", "figure");
    const stage = element("div", "stage");
    stage.style.setProperty("--native", card.size[0] + "px");
    const img = element("img");
    img.src = card.jpg;
    img.alt = card.title + "の教材画像";
    [img.width, img.height] = card.size;
    stage.append(img);
    for (const [i, hole] of card.holes.entries()) {
      const mask = holeButton(i, "mask");
      const [x, y, w, h] = hole.rect;
      for (const [property, value] of Object.entries({
        left: x / card.size[0], top: y / card.size[1], width: w / card.size[0], height: h / card.size[1]
      })) mask.style[property] = value * 100 + "%";
      stage.append(mask);
    }
    viewport.append(stage);
    zoom = btn("拡大", () => {
      const enlarged = viewport.classList.toggle("zoom");
      zoom.textContent = enlarged ? "全体表示" : "拡大";
      zoom.setAttribute("aria-pressed", enlarged);
    });
    zoom.setAttribute("aria-pressed", "false");
    tools.append(zoom);
    const buttons = element("div", "hole-list");
    for (let i = 0; i < card.holes.length; i++) buttons.append(holeButton(i, "list"));
    article.append(tools, viewport, buttons);
  }
  grader = element("section", "grader");
  grader.id = "grade";
  grader.setAttribute("aria-live", "polite");
  openingDetails = element("details");
  openingDetails.append(element("summary", "", "解説と元画像（JPG）を確認"), element("p", "", card.note));
  const full = element("img");
  full.src = card.jpg;
  full.alt = "画像 " + card.source + " の全体";
  full.loading = "lazy";
  openingDetails.append(full);
  article.append(grader, openingDetails);
  refresh();
}

function refresh() {
  const card = cards[cardIndex];
  const results = records[card.source] || {};
  count.textContent = "採点 " + card.holes.filter((_,i) => results[i]).length + " / " + card.holes.length;
  for (const { trigger, index, mode } of triggers) {
    const result = results[index] || "";
    const isOpen = index === active;
    const marker = String(index + 1);
    const suffix = result === "good" ? " ○" : result === "again" ? " ×" : "";
    trigger.textContent = mode === "text" && isOpen ? card.holes[index].answer : marker + suffix;
    trigger.dataset.result = result;
    trigger.classList.toggle("is-open", isOpen && mode === "mask");
    trigger.setAttribute("aria-expanded", isOpen);
    trigger.setAttribute("aria-label", "穴" + marker + " " + card.holes[index].cue + suffix);
  }
  grader.replaceChildren();
  if (active < 0) {
    grader.append(element("p", "", "各番号を開いて自己採点します。" + (storageAvailable ? "" : " この環境では採点は開いている間だけ保持します。")));
    return;
  }
  const i = active;
  const hole = card.holes[i];
  grader.append(element("p", "", String(i + 1) + "　" + hole.cue), element("strong", "answer", hole.answer));
  const rates = element("div", "rates");
  for (const [label, result] of [["× 要復習", "again"], ["○ 正解", "good"]]) {
    rates.append(btn(label, () => {
      records[card.source] = { ...results, [i]: result };
      try { localStorage.setItem(recordKey, JSON.stringify(records)); }
      catch { storageAvailable = false; }
      active = -1;
      refresh();
      lastTrigger?.focus({preventScroll:true});
    }));
  }
  grader.append(rates);
}
for (const [i, label] of labels.entries()) nav.append(btn(label, () => { cardIndex = i; render(); }));
render();
</script>
</body>
</html>
