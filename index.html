<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#112b36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="心電図ドリル">
  <meta name="description" content="心電図検定の所見と鑑別を、思い出して定着させる一問一答。">
  <title>心電図ドリル</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple.png">
  <script defer src="./cards.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand"><span class="brand-icon" aria-hidden="true">∿</span><h1>心電図ドリル</h1></div>
      <nav aria-label="学習画面">
        <button id="tab-study" aria-current="page" type="button">出題</button>
        <button id="tab-list" type="button">カード一覧</button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="numbers" aria-label="学習状況">
      <div><strong id="due-count">–</strong><span>復習期限</span></div>
      <div><strong id="new-count">–</strong><span>未学習</span></div>
      <div><strong id="total-count">–</strong><span>全カード</span></div>
    </section>
    <section id="study-panel" aria-labelledby="study-heading">
      <form id="session-setup" class="sheet">
        <div class="section-title"><h2 id="study-heading">今日の出題</h2><p>復習期限に達したカードを優先します。</p></div>
        <div class="form-grid">
          <label>分野<select id="study-category"></select></label>
          <label>出題範囲<select id="study-mode">
            <option value="due">復習＋未学習</option>
            <option value="weak">苦手のみ</option>
            <option value="all">全カード</option>
          </select></label>
          <label>問題数<select id="study-size">
            <option value="10">10問</option><option value="5">5問</option><option value="all">対象すべて</option>
          </select></label>
        </div>
        <button class="primary" type="submit" id="start-button">学習を始める</button>
        <p id="pool-label" class="muted small" aria-live="polite"></p>
      </form>
      <section id="session" hidden aria-label="出題中">
        <div class="session-bar">
          <span id="session-position"></span>
          <button class="quiet" id="end-session" type="button">出題設定へ</button>
        </div>
        <progress id="progress" aria-label="セッションの進み具合"></progress>
        <div id="question-host"></div>
      </section>
    </section>
    <section id="list-panel" hidden aria-labelledby="list-heading" class="sheet">
      <div class="section-title"><h2 id="list-heading">カード一覧</h2></div>
      <div class="form-grid list-form">
        <label>キーワード<input type="search" id="search" placeholder="例：V4R、QT、049" autocomplete="off"></label>
        <label>分野<select id="list-category"></select></label>
        <label>学習状況<select id="list-status">
          <option value="all">すべて</option><option value="due">復習期限</option>
          <option value="new">未学習</option><option value="weak">苦手</option>
        </select></label>
      </div>
      <p class="muted small" id="list-count" aria-live="polite"></p>
      <div id="card-list"></div>
    </section>
    <details class="settings">
      <summary>元画像・使い方</summary>
      <div class="settings-body">
        <p>「答えを見る」のあとに自己採点します。「もう一度」を付けたカードは同じ回の最後に再出題します。解き直しても難しかったカードは次回も優先します。「覚えた」を重ねると復習間隔が延びます。</p>
        <label for="image-input">元画像をこの端末に読み込む</label>
        <input id="image-input" type="file" accept=".png,image/png" multiple>
        <p id="source-status" class="muted small" aria-live="polite">「001.png」のように番号が付いた元画像を選ぶと、解説下で見比べられます。</p>
        <p class="muted small">学習記録と読み込んだ画像はこのブラウザに保存します。iPhoneではSafariの共有メニューからホーム画面に追加できます。</p>
      </div>
    </details>
  </main>
  <footer class="wrap footer">心電図検定の学習用</footer>
  <template id="card-template">
    <article class="sheet question-card">
      <div class="question-meta"><span data-field="category" class="category"></span><span data-field="number"></span></div>
      <h2 data-field="question" tabindex="-1"></h2>
      <button type="button" class="primary" data-field="reveal" aria-expanded="false">答えを見る</button>
      <div data-field="solution" class="solution" hidden>
        <div class="answer-label">答え</div>
        <p data-field="answer" class="answer" tabindex="-1"></p>
        <div class="point"><span>判読のポイント</span><p data-field="point"></p></div>
        <div data-field="sources" class="sources"></div>
        <div data-field="grading" class="grading">
          <button type="button" data-score="again">もう一度</button>
          <button type="button" data-score="good" class="primary">覚えた</button>
        </div>
      </div>
    </article>
  </template>
</body>
</html>
